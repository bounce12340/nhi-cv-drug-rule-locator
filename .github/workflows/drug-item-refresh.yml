name: Drug item monthly refresh

on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drug-item-monthly-refresh
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Check upstream and derive a hash-locked candidate
        id: check
        shell: bash
        run: |
          fetched_at="$(date -u +%F)"
          result="$(node scripts/drug-item-refresh-check.mjs --date "$fetched_at")"
          changed="$(jq -r '.changed' <<<"$result")"
          artifact_name="$(jq -r '.artifact.name // empty' <<<"$result")"
          {
            echo "changed=$changed"
            echo "fetched_at=$fetched_at"
            echo "artifact_name=$artifact_name"
            echo "result=$(jq -c '.' <<<"$result")"
          } >> "$GITHUB_OUTPUT"

      - name: Record no-change result
        if: steps.check.outputs.changed == 'false'
        shell: bash
        run: echo "Drug item master source is unchanged; no artifact or pull request was created." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate subset as the only payload carrier
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.artifact_name }}
          path: scratchpad/drug-item-refresh/drug-items-lipid.csv
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Materialize pending metadata and count-only report
        if: steps.check.outputs.changed == 'true'
        id: materialize
        shell: bash
        env:
          REFRESH_RESULT_JSON: ${{ steps.check.outputs.result }}
        run: |
          materialized="$(node scripts/drug-item-refresh-materialize.mjs)"
          {
            echo "approval=$(jq -r '.approvalWording' <<<"$materialized")"
            echo "report_path=$(jq -r '.reportPath' <<<"$materialized")"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update a draft intake pull request
        if: steps.check.outputs.changed == 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(intake): detect drug item refresh ${{ steps.check.outputs.fetched_at }}"
          branch: automation/drug-item-refresh-${{ steps.check.outputs.fetched_at }}
          delete-branch: false
          draft: true
          title: "[DRAFT] 偵測到藥品品項主檔新版本 ${{ steps.check.outputs.fetched_at }}"
          body: |
            上游雜湊已變更；本 PR 只包含 registry pending metadata、來源登錄追記與只含計數的 Stage 3 差異報告。

            候選子集只存在於保留 90 天的 GitHub Actions artifact `${{ steps.check.outputs.artifact_name }}`，不在 repo 或本 PR 內文。

            RA 核對 artifact 與報告後，如決定窄幅核准，請逐字複製：`${{ steps.materialize.outputs.approval }}`

            此 draft PR 不構成核准、入庫或合併授權。
          add-paths: |
            docs/source-register/drug-item-master.registry.json
            docs/source-register/nhi-drug-item-master-20260806.md
            docs/stage3/drug-item-refresh-${{ steps.check.outputs.fetched_at }}.md

      - name: Record changed result
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: echo "A metadata-only draft intake pull request was prepared; candidate payload remains artifact-only." >> "$GITHUB_STEP_SUMMARY"
