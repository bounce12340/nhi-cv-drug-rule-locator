name: Deploy

# Cloudflare credentials live only as repository Actions secrets
# (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID).
# The site is a static bundle on Cloudflare Pages — there is no Worker and no API.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require deploy secrets
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::$missing is empty or unavailable. Add it as a repository Actions secret (Environment and Dependabot secrets are not supplied to this workflow)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm export:web

      - name: Deploy to Cloudflare Pages
        run: >
          pnpm exec wrangler pages deploy "${{ github.workspace }}/apps/clinician/dist"
          --project-name nhi-cv-lookup --branch main --commit-dirty=true

      - name: Post-deploy smoke check
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://nhi.uic-ai.com/ --max-time 20 || true)
            [ "$code" = "200" ] && echo "web OK ($code)" && exit 0
            echo "attempt $attempt: HTTP $code, retrying"
            sleep 10
          done
          echo "::error::post-deploy smoke check failed (last HTTP $code)"
          exit 1
